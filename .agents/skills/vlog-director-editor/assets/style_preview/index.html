<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เลือก Style วิดีโอ</title>
<style>
:root{--bg:#111216;--panel:#191b21;--raise:#23262e;--line:#2c2f39;--ink:#f1efe9;--dim:#9a9da8;--accent:#ffd23f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Leelawadee UI',sans-serif;font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
/* Thin dark scrollbars that brighten on hover, in place of the white system ones. */
:root{color-scheme:dark}
*{scrollbar-width:thin;scrollbar-color:#3a3e4a transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a3e4a;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#565b6b}
::-webkit-scrollbar-button{display:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr) 312px;grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;white-space:nowrap}
header p{margin:0;color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Left: the style list, grouped by mood */
.styles{position:relative;overflow-y:auto;padding:14px 10px 20px;border-right:1px solid var(--line)}
.styles h2{font-size:12px;font-weight:500;color:var(--dim);margin:16px 10px 6px}
.styles h2:first-child{margin-top:0}
.style{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;border-left:3px solid transparent}
.style b{display:block;font-weight:600}
.style small{display:block;color:var(--dim);font-size:12px;line-height:1.3}
.style:hover{background:var(--panel)}
.style[aria-pressed=true]{background:var(--raise);border-left-color:var(--accent)}

/* Centre: the player */
main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 20px 12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:12px}
.bar .label{color:var(--dim);font-size:12px;margin-right:-6px}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;max-width:100%;overflow-x:auto}
.seg button{color:var(--dim);border-radius:6px;padding:5px 12px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--ink)}
.spacer{flex:1}
.stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#08090b;border:1px solid var(--line);border-radius:12px}
.stage{position:relative;overflow:hidden;background:#000;border-radius:4px}
.stage video{position:absolute;left:0;width:100%;object-fit:cover}
.stage #root{position:absolute;left:0;top:0;transform-origin:0 0}
.note{color:var(--dim);font-size:12px;margin:8px 0 0;display:flex;justify-content:space-between;gap:16px}

/* Right: what the chosen style is, and its fonts */
.side{overflow-y:auto;padding:16px 18px 20px;border-left:1px solid var(--line)}
.side h2{font-size:20px;margin:0;line-height:1.3}
.side .en{color:var(--dim);font-size:13px;margin:2px 0 14px}
.facts{margin:0;display:grid;gap:10px}
.facts dt{color:var(--dim);font-size:12px}
.facts dd{margin:0}
.facts .warn dd{color:#ffcf8a}
.side h3{font-size:12px;color:var(--dim);font-weight:500;margin:18px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.fontbtn{display:flex;align-items:baseline;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin-bottom:6px}
.fontbtn span{font-size:22px;line-height:1.6;white-space:nowrap;overflow:hidden}
.fontbtn small{color:var(--dim);font-size:12px;white-space:nowrap}
.fontbtn:hover{background:var(--panel)}
.fontbtn[aria-pressed=true]{border-color:var(--accent);background:var(--raise)}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.pick p{margin:0;flex:1;user-select:all}
.pick button{border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:13px;color:var(--dim)}
.pick button:hover{color:var(--ink)}

@media(max-width:1080px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:none}
  header{flex-direction:column;gap:2px}
  header p{white-space:normal}
  .styles{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 16px}
  .styles h2{display:none}
  .style{width:auto;white-space:nowrap;border-left:0;border:1px solid var(--line)}
  .style small{display:none}
  .style[aria-pressed=true]{border-color:var(--accent)}
  main{padding:12px 16px}
  .stage-wrap{flex:none;height:62vh}
  .side{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>เลือก Style วิดีโอ</h1>
    <p>เล่นบนคลิปจริงของโปรเจกต์ด้วยระบบกราฟิกชุดเดียวกับตอนเรนเดอร์ หนึ่งตอนใช้หนึ่งแนว</p>
  </header>
  <nav class="styles" id="styles" aria-label="แนวกราฟิก"></nav>
  <main>
    <div class="bar">
      <span class="label">ฉาก</span><div class="seg" id="moments"></div>
      <span class="spacer"></span>
      <div class="seg" id="formats"></div>
      <div class="seg"><button id="sound" aria-pressed="false">เปิดเสียง</button></div>
    </div>
    <div class="stage-wrap" id="wrap"><div class="stage" id="stage"><video id="v" muted playsinline></video><div id="root"></div></div></div>
    <p class="note"><span>ข้อความในคลิปเป็นตัวอย่างเพื่อดูสไตล์ ยังไม่ใช่บทจริง</span><span>ปุ่มลูกศร ↑ ↓ เปลี่ยนแนว ← → เปลี่ยนฉาก</span></p>
  </main>
  <aside class="side" id="side"></aside>
</div>
<script src="engine.js"></script>
<!--STYLE_SCRIPTS-->
<script src="preview_data.js"></script>
<script>
const P = window.PREVIEW, M = P.manifest.styles;
const FORMATS = {
  v: {label: 'แนวตั้ง 9:16', format: {w: 1080, h: 1920, fps: 50}, win: {y: 640, h: 760}},
  h: {label: 'แนวนอน 16:9', format: {w: 1920, h: 1080, fps: 50}, win: {y: 0, h: 1080}},
};
/* Sidebar groups, in this order; a style names its group with "group" in styles.json. */
const GROUPS = {fun: 'สนุก พลังเยอะ', craft: 'อบอุ่น งานมือ', calm: 'นิ่ง สวย เล่าเรื่อง', info: 'ให้ข้อมูล', other: 'อื่นๆ'};
const ORDER = Object.keys(GROUPS).flatMap(g => Object.keys(M).filter(k => (GROUPS[M[k].group] ? M[k].group : 'other') === g));
const q = new URLSearchParams(location.search);
const state = {style: q.get('style') || ORDER[0], moment: q.get('moment') || P.moments[0].id, fmt: q.get('fmt') || 'v', font: null};
const freezeAt = q.has('t') ? parseFloat(q.get('t')) : null;
const $ = (s) => document.querySelector(s);
const v = $('#v'), stage = $('#stage'), root = $('#root'), wrap = $('#wrap');
let ready = false, building = 0;

function comp() {
  const m = P.moments.find(x => x.id === state.moment), f = FORMATS[state.fmt], st = M[state.style];
  const cues = [];
  if (m.label) cues.push({type: 'label', text: m.label, t: .2, end: m.dur - .2});
  if (m.impact) cues.push({type: 'impact', words: m.impact.words, t: m.impact.t, end: m.impact.end});
  if (m.speech) cues.push({type: 'speech', text: m.speech.text, t: m.speech.t, end: m.speech.end});
  if (m.comment) cues.push({type: 'comment', text: m.comment.text, t: m.comment.t, end: m.comment.end});
  const fonts = [...st.fonts];
  if (state.font) fonts.push(st.font_options.find(o => o.family === state.font));
  const c = {style: state.style, format: {...f.format, dur: m.dur}, video_window: f.win, fonts, font: state.font,
          fonts_uri: new URL(P.fonts_uri, location.href).href, cues};
  if (st.preview_postmark) c.postmarks = [{t: 0, lines: st.preview_postmark}];
  return c;
}

/* The stage takes whatever room the centre column has, in both formats. */
function fitStage() {
  const f = FORMATS[state.fmt];
  const k = Math.max(.1, Math.min((wrap.clientWidth - 24) / f.format.w, (wrap.clientHeight - 24) / f.format.h));
  stage.style.width = f.format.w * k + 'px';
  stage.style.height = f.format.h * k + 'px';
  root.style.transform = `scale(${k})`;
  v.style.top = f.win.y * k + 'px';
  v.style.height = f.win.h * k + 'px';
}

async function build() {
  const id = ++building;
  ready = false;
  const m = P.moments.find(x => x.id === state.moment);
  fitStage();
  renderUI();
  if (!v.src.endsWith(m.src)) v.src = m.src;
  await window.init(comp(), root);
  if (id !== building) return;
  ready = true;
  if (freezeAt !== null) {
    v.pause();
    const apply = () => { v.currentTime = freezeAt; window.seek(freezeAt); };
    v.readyState >= 1 ? apply() : v.addEventListener('loadedmetadata', apply, {once: true});
  } else {
    v.currentTime = 0;
    v.play().catch(() => {});
  }
}

function renderNav() {
  let html = '', last = null;
  for (const k of ORDER) {
    const g = GROUPS[M[k].group] ? M[k].group : 'other';
    if (g !== last) { html += `<h2>${GROUPS[g]}</h2>`; last = g; }
    html += `<button class="style" data-s="${k}"><b>${M[k].name_th}</b><small>${M[k].name_en}</small></button>`;
  }
  $('#styles').innerHTML = html;
  $('#moments').innerHTML = P.moments.map(m => `<button data-m="${m.id}">${m.name_th}</button>`).join('');
  $('#formats').innerHTML = Object.entries(FORMATS).map(([k, f]) => `<button data-f="${k}">${f.label}</button>`).join('');
}

function renderUI() {
  const press = (sel, key, val) => document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', b.dataset[key] === val));
  press('[data-s]', 's', state.style); press('[data-m]', 'm', state.moment); press('[data-f]', 'f', state.fmt);
  const nav = $('#styles'), on = nav.querySelector('[aria-pressed=true]');
  /* Keep the chosen style in view inside the list without moving the page. */
  if (on) {
    if (on.offsetTop < nav.scrollTop || on.offsetTop + on.offsetHeight > nav.scrollTop + nav.clientHeight) nav.scrollTop = on.offsetTop - nav.clientHeight / 2;
    if (on.offsetLeft < nav.scrollLeft || on.offsetLeft + on.offsetWidth > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = on.offsetLeft - nav.clientWidth / 2;
  }
  const s = M[state.style], cur = state.font || s.font_options[0].family;
  $('#side').innerHTML = `<h2>${s.name_th}</h2><p class="en">${s.name_en} · <code>${state.style}</code></p>
    <dl class="facts"><div><dt>เหมาะกับ</dt><dd>${s.fit_th}</dd></div><div><dt>ความแน่นของกราฟิก</dt><dd>${s.density_th}</dd></div>
    <div><dt>เสียงประกอบ</dt><dd>${s.sfx_th}</dd></div><div class="warn"><dt>ข้อควรระวัง</dt><dd>${s.warn_th}</dd></div></dl>
    <h3>ฟอนต์ กดเพื่อลองในคลิป</h3>${s.font_options.map(f => `<button class="fontbtn" data-font="${f.family}" aria-pressed="${f.family === cur}"><span style="font-family:'${f.family}';font-weight:${String(f.weight).split(' ').pop()}">ไม่อยากกลับบ้าน!</span><small>${f.family}</small></button>`).join('')}
    <h3>ถ้าชอบแบบนี้ บอกเอเจนต์ว่า</h3><div class="pick"><p id="pick">เลือกแนว ${s.name_th} ฟอนต์ ${cur}</p><button id="copy">คัดลอก</button></div>`;
}

function tick() {
  if (ready && freezeAt === null) {
    if (v.ended) { v.currentTime = 0; v.play().catch(() => {}); }
    window.seek(v.currentTime);
  }
  requestAnimationFrame(tick);
}

function step(list, cur, d) { return list[(list.indexOf(cur) + d + list.length) % list.length]; }

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.s) { state.style = b.dataset.s; state.font = null; build(); }
  else if (b.dataset.m) { state.moment = b.dataset.m; build(); }
  else if (b.dataset.f) { state.fmt = b.dataset.f; build(); }
  else if (b.dataset.font) { state.font = b.dataset.font; build(); }
  else if (b.id === 'sound') { v.muted = !v.muted; b.textContent = v.muted ? 'เปิดเสียง' : 'ปิดเสียง'; b.setAttribute('aria-pressed', !v.muted); }
  else if (b.id === 'copy') {
    const done = () => { b.textContent = 'คัดลอกแล้ว'; };
    const select = () => { getSelection().selectAllChildren($('#pick')); };
    try { navigator.clipboard.writeText($('#pick').textContent).then(done, select); } catch (err) { select(); }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const moments = P.moments.map(m => m.id);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { state.style = step(ORDER, state.style, e.key === 'ArrowDown' ? 1 : -1); state.font = null; }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') state.moment = step(moments, state.moment, e.key === 'ArrowRight' ? 1 : -1);
  else return;
  e.preventDefault();
  build();
});

(async () => {
  const faces = new Set();
  Object.values(M).forEach(s => [...s.fonts, ...s.font_options].forEach(f => faces.add(JSON.stringify(f))));
  const css = [...faces].map(j => { const f = JSON.parse(j); return `@font-face{font-family:'${f.family}';font-weight:${f.weight};src:url('${P.fonts_uri}/${f.file}')}`; }).join('');
  document.head.appendChild(Object.assign(document.createElement('style'), {textContent: css}));
  if (!M[state.style]) state.style = ORDER[0];
  renderNav();
  await build();
  tick();
})();
window.addEventListener('resize', () => { fitStage(); });
</script>
</body>
</html>
