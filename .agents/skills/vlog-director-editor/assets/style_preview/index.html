<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เลือก Style วิดีโอ</title>
<style>
:root{--bg:#14151a;--panel:#1e2027;--line:#30333d;--ink:#f1efe9;--dim:#a4a6ae;--accent:#ffd23f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Leelawadee UI',sans-serif;font-size:16px;line-height:1.6}
.app{max-width:1280px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--dim);margin:0 0 20px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
button{font:inherit;cursor:pointer}
.tab{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-weight:600}
.tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#17181c}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.controls{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px}
.group{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
.group button{background:none;color:var(--dim);border:0;border-radius:6px;padding:6px 12px}
.group button[aria-pressed=true]{background:#3a3e4a;color:var(--ink)}
.stage-wrap{display:flex;justify-content:center;background:#0b0c0f;border-radius:10px;padding:12px}
.stage{position:relative;overflow:hidden;background:#000}
.stage video{position:absolute;left:0;width:100%;object-fit:cover}
.stage #root{position:absolute;left:0;top:0;transform-origin:0 0}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.side h2{font-size:20px;margin:0}
.side .en{color:var(--dim);font-size:14px;margin:0 0 10px}
.side dt{color:var(--dim);font-size:13px;margin-top:10px}
.side dd{margin:0}
.fonts{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.fonts h3{font-size:14px;color:var(--dim);font-weight:500;margin:0 0 8px}
.fontbtn{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;margin-bottom:6px}
.fontbtn[aria-pressed=true]{border-color:var(--accent)}
.fontbtn span{display:block;font-size:24px;line-height:1.5}
.fontbtn small{color:var(--dim);font-size:12px}
.note{color:var(--dim);font-size:14px;margin-top:14px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <h1>เลือก Style วิดีโอ</h1>
  <p class="sub">เล่นบนคลิปจริงของโปรเจกต์ ด้วยระบบกราฟิกชุดเดียวกับตอนเรนเดอร์ กดสลับแนว ฉาก รูปแบบ และฟอนต์ได้ แล้วบอกเอเจนต์ว่าชอบแนวไหน หนึ่งตอนใช้หนึ่งแนว</p>
  <div class="tabs" id="tabs"></div>
  <div class="layout">
    <div>
      <div class="controls">
        <div class="group" id="moments"></div>
        <div class="group" id="formats"></div>
        <div class="group"><button id="sound" aria-pressed="false">เปิดเสียง</button></div>
      </div>
      <div class="stage-wrap"><div class="stage" id="stage"><video id="v" muted playsinline></video><div id="root"></div></div></div>
      <p class="note">คอมเมนต์และป้ายในหน้านี้เป็นตัวอย่างเพื่อดูสไตล์ ยังไม่ใช่บทจริง</p>
    </div>
    <aside class="side" id="side"></aside>
  </div>
</div>
<script src="engine.js"></script>
<!--STYLE_SCRIPTS-->
<script src="preview_data.js"></script>
<script>
const P = window.PREVIEW, M = P.manifest.styles;
const FORMATS = {
  v: {label: 'แนวตั้ง 9:16', format: {w: 1080, h: 1920, fps: 50}, win: {y: 640, h: 760}},
  h: {label: 'แนวนอน 16:9', format: {w: 1920, h: 1080, fps: 50}, win: {y: 0, h: 1080}},
};
const q = new URLSearchParams(location.search);
const state = {style: q.get('style') || Object.keys(M)[0], moment: q.get('moment') || P.moments[0].id, fmt: q.get('fmt') || 'v', font: null};
const freezeAt = q.has('t') ? parseFloat(q.get('t')) : null;
const $ = (s) => document.querySelector(s);
const v = $('#v'), stage = $('#stage'), root = $('#root');
let ready = false, building = 0;

function comp() {
  const m = P.moments.find(x => x.id === state.moment), f = FORMATS[state.fmt], st = M[state.style];
  const cues = [];
  if (m.label) cues.push({type: 'label', text: m.label, t: .2, end: m.dur - .2});
  if (m.impact) cues.push({type: 'impact', words: m.impact.words, t: m.impact.t, end: m.impact.end});
  if (m.speech) cues.push({type: 'speech', text: m.speech.text, t: m.speech.t, end: m.speech.end});
  if (m.comment) cues.push({type: 'comment', text: m.comment.text, t: m.comment.t, end: m.comment.end});
  const fonts = [...st.fonts];
  if (state.font) fonts.push(st.font_options.find(o => o.family === state.font));
  const c = {style: state.style, format: {...f.format, dur: m.dur}, video_window: f.win, fonts, font: state.font,
          fonts_uri: new URL(P.fonts_uri, location.href).href, cues};
  if (st.preview_postmark) c.postmarks = [{t: 0, lines: st.preview_postmark}];
  return c;
}

async function build() {
  const id = ++building;
  ready = false;
  const f = FORMATS[state.fmt], m = P.moments.find(x => x.id === state.moment);
  const width = Math.min(stage.parentElement.clientWidth - 24, state.fmt === 'v' ? 420 : 900);
  const k = width / f.format.w;
  stage.style.width = width + 'px';
  stage.style.height = f.format.h * k + 'px';
  root.style.transform = `scale(${k})`;
  v.style.top = f.win.y * k + 'px';
  v.style.height = f.win.h * k + 'px';
  if (!v.src.endsWith(m.src)) v.src = m.src;
  await window.init(comp(), root);
  if (id !== building) return;
  ready = true;
  if (freezeAt !== null) {
    v.pause();
    const apply = () => { v.currentTime = freezeAt; window.seek(freezeAt); };
    v.readyState >= 1 ? apply() : v.addEventListener('loadedmetadata', apply, {once: true});
  } else {
    v.currentTime = 0;
    v.play().catch(() => {});
  }
  renderUI();
}

function renderUI() {
  $('#tabs').innerHTML = Object.entries(M).map(([k, s], i) =>
    `<button class="tab" data-s="${k}" aria-pressed="${k === state.style}">${i + 1}. ${s.name_th}</button>`).join('');
  $('#moments').innerHTML = P.moments.map(m => `<button data-m="${m.id}" aria-pressed="${m.id === state.moment}">${m.name_th}</button>`).join('');
  $('#formats').innerHTML = Object.entries(FORMATS).map(([k, f]) => `<button data-f="${k}" aria-pressed="${k === state.fmt}">${f.label}</button>`).join('');
  const s = M[state.style], cur = state.font || s.font_options[0].family;
  $('#side').innerHTML = `<h2>${s.name_th}</h2><p class="en">${s.name_en} · <code>${state.style}</code></p>
    <dl><dt>เหมาะกับ</dt><dd>${s.fit_th}</dd><dt>ความแน่นของกราฟิก</dt><dd>${s.density_th}</dd><dt>SFX</dt><dd>${s.sfx_th}</dd><dt>ข้อควรระวัง</dt><dd>${s.warn_th}</dd></dl>
    <div class="fonts"><h3>ฟอนต์ กดเพื่อลองในคลิป</h3>${s.font_options.map(f => `<button class="fontbtn" data-font="${f.family}" aria-pressed="${f.family === cur}"><span style="font-family:'${f.family}';font-weight:${String(f.weight).split(' ').pop()}">ไม่อยากกลับบ้าน!</span><small>${f.family}</small></button>`).join('')}</div>`;
}

function tick() {
  if (ready && freezeAt === null) {
    if (v.ended) { v.currentTime = 0; v.play().catch(() => {}); }
    window.seek(v.currentTime);
  }
  requestAnimationFrame(tick);
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.s) { state.style = b.dataset.s; state.font = null; build(); }
  else if (b.dataset.m) { state.moment = b.dataset.m; build(); }
  else if (b.dataset.f) { state.fmt = b.dataset.f; build(); }
  else if (b.dataset.font) { state.font = b.dataset.font; build(); }
  else if (b.id === 'sound') { v.muted = !v.muted; b.textContent = v.muted ? 'เปิดเสียง' : 'ปิดเสียง'; b.setAttribute('aria-pressed', !v.muted); }
});

(async () => {
  const faces = new Set();
  Object.values(M).forEach(s => [...s.fonts, ...s.font_options].forEach(f => faces.add(JSON.stringify(f))));
  const css = [...faces].map(j => { const f = JSON.parse(j); return `@font-face{font-family:'${f.family}';font-weight:${f.weight};src:url('${P.fonts_uri}/${f.file}')}`; }).join('');
  document.head.appendChild(Object.assign(document.createElement('style'), {textContent: css}));
  renderUI();
  await build();
  tick();
})();
window.addEventListener('resize', () => build());
</script>
</body>
</html>
