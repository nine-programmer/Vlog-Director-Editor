<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;background:transparent;overflow:hidden}
#root{position:relative;overflow:hidden}
.paper{position:absolute;left:0;top:0;width:100%;background-image:var(--grain)}
.ob{position:absolute;left:0;top:0;visibility:hidden}
.shadow{filter:drop-shadow(4px 7px 5px rgba(40,25,10,.42))}
.piece{padding:12px 40px;color:#2b2a28;background-image:var(--grain);white-space:nowrap;line-height:1.5}
.tape{position:absolute;background:rgba(238,214,150,.72);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.postmark{position:absolute;border:5px solid #d9472b;border-radius:50%;color:#d9472b;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.82;line-height:1.3;text-align:center;font:700 29px Mali}
.stamp{border:9px solid #c8323c;color:#c8323c;border-radius:16px;padding:4px 30px;font:700 72px Mali;line-height:1.45;white-space:nowrap;opacity:.9}
.route text{font:700 28px Mali;fill:#5b4630}
</style>
</head>
<body>
<div id="root"></div>
<script>
const grainSvg = `<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32 0 0 0 0 .24 0 0 0 0 .14 0 0 0 .34 0'/></filter><rect width='320' height='320' filter='url(#n)'/></svg>`;
document.documentElement.style.setProperty('--grain', `url("data:image/svg+xml,${encodeURIComponent(grainSvg)}")`);

const HOLD = 12, BOIL = 2, IN = 3, MAX_W = 980;
const PALETTE = ['#f5ebdd', '#e3a72f', '#6fb7a8'];
const TEXT = {
  speech: {size: 56, bg: '#f5ebdd', tilt: -1},
  voice: {size: 54, bg: '#fffdf7', tilt: 1, color: '#5a4636'},
  comment: {size: 52, bg: '#e3a72f', tilt: 2},
  label: {size: 42, bg: '#fffaf0', tilt: -2.5, color: '#d9472b'},
  score: {size: 60, bg: '#d9472b', tilt: -2, color: '#fff8ec'},
  tag: {size: 32, bg: '#6fb7a8', tilt: 2, color: '#1f2b28'},
};
let C, items = [], bars = [], postEl;

function rng(seed) { let s = seed % 2147483646 + 1; return () => (s = s * 16807 % 2147483647) / 2147483647; }
function hash(n) { const r = rng(n * 7919 + 13); r(); return r(); }
function q(t) { return Math.floor(t * HOLD + 1e-6); }
function tornEdge(seed, steps, depth) { const r = rng(seed), o = []; for (let i = 0; i <= steps; i++) o.push((i % 3 === 0 ? r() : r() * .45) * depth); return o; }
function tornBox(seed) {
  const n = 26, top = tornEdge(seed, n, 9), bot = tornEdge(seed + 5, n, 9), p = [];
  top.forEach((d, i) => p.push(`${(i / n * 100).toFixed(2)}% ${d.toFixed(2)}%`));
  bot.reverse().forEach((d, i) => p.push(`${(100 - i / n * 100).toFixed(2)}% ${(100 - d).toFixed(2)}%`));
  return `polygon(${p.join(',')})`;
}
function barClip(W, H, edge, seed, side) {
  const n = 90, e = tornEdge(seed, n, 20), p = [];
  if (side === 'top') { p.push('0 0', `${W}px 0`); for (let i = n; i >= 0; i--) p.push(`${(i / n * W).toFixed(1)}px ${(edge + e[i] - 10).toFixed(1)}px`); }
  else { p.push(`0 ${H}px`, `${W}px ${H}px`); for (let i = n; i >= 0; i--) p.push(`${(i / n * W).toFixed(1)}px ${(edge - e[i] + 10).toFixed(1)}px`); }
  return `polygon(${p.join(',')})`;
}
function node(tag, cls, css, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html !== undefined) e.innerHTML = html; return e; }
function latest(list, t) { let v = list[0]; for (const x of list) if (x.t <= t + 1e-6) v = x; return v; }

/* ---- items ---- */
function addItem(root, el, cue, opts) {
  root.appendChild(el);
  const it = {el, cue, start: opts.start ?? cue.t, end: cue.end, x: opts.x, y: opts.y, ax: opts.ax ?? .5, ay: .5,
              tilt: opts.tilt ?? 0, seed: opts.seed, fit: opts.fit ?? 1, enter: opts.enter ?? 'pop', flip: opts.flip ? -1 : 1,
              w: el.offsetWidth, h: el.offsetHeight, update: opts.update};
  el.style.transformOrigin = `${it.w / 2}px ${it.h / 2}px`;
  items.push(it);
  return it;
}
function textEl(kind, text, seed, colorOverride) {
  const s = TEXT[kind], wrap = node('div', 'ob shadow');
  const p = node('div', 'piece', `font:700 ${s.size}px Mali;background-color:${colorOverride || s.bg};clip-path:${tornBox(seed)};${s.color ? 'color:' + s.color : ''}`, text);
  wrap.appendChild(p);
  return wrap;
}
function standardUpdate(it, t) {
  const local = q(t) - q(it.start), on = local >= 0 && t < it.end;
  it.el.style.visibility = on ? 'visible' : 'hidden';
  if (!on) return;
  let scale = 1;
  if (it.enter === 'pop') scale = 1 + (1 - Math.min(local / IN, 1)) * .38;
  if (it.enter === 'stamp') scale = local < 2 ? 1.9 - local * .45 : 1;
  const boil = Math.floor(q(t) / BOIL);
  const rot = it.tilt + (hash(boil + it.seed) - .5) * 1.6;
  const dx = (hash(boil + it.seed + 3) - .5) * 3, dy = (hash(boil + it.seed + 7) - .5) * 3;
  it.el.style.transform = `translate(${it.x - it.w * it.ax + dx}px,${it.y - it.h * it.ay + dy}px) rotate(${rot}deg) scale(${scale * it.fit * it.flip},${scale * it.fit})`;
}

const BUILD = {
  text(root, cue, seed) {
    const el = textEl(cue.type, cue.text, seed, cue.color);
    root.appendChild(el);
    const fit = Math.min(1, MAX_W / el.offsetWidth);
    root.removeChild(el);
    addItem(root, el, cue, {x: cue.x ?? C.format.w / 2, y: cue.y, ax: cue.ax ?? .5, tilt: TEXT[cue.type].tilt, seed, fit});
  },
  impact(root, cue, seed) {
    const els = cue.words.map((w, k) => {
      const wrap = node('div', 'ob shadow');
      wrap.appendChild(node('div', 'piece', `font:700 ${cue.size || 160}px Mali;background-color:${PALETTE[k % 3]};clip-path:${tornBox(seed + k)}`, w));
      root.appendChild(wrap);
      return wrap;
    });
    const gap = 18, total = els.reduce((s, e) => s + e.offsetWidth, 0) + gap * (els.length - 1);
    const fit = Math.min(1, MAX_W / total);
    let x = C.format.w / 2 - total * fit / 2;
    els.forEach((e, k) => {
      const w = e.offsetWidth * fit;
      root.removeChild(e);
      addItem(root, e, cue, {start: cue.t + k * (cue.stagger ?? .25), x: x + w / 2, y: cue.y, tilt: k % 2 ? 3.2 : -3.2, seed: seed + k * 3, fit});
      x += w + gap * fit;
    });
  },
  stamp(root, cue, seed) {
    const el = node('div', 'ob stamp', '', cue.text);
    addItem(root, el, cue, {x: cue.x ?? C.format.w / 2, y: cue.y, tilt: cue.tilt ?? -10, seed, enter: 'stamp'});
  },
  sticker(root, cue, seed) {
    const el = node('img', 'ob shadow', `width:${cue.w}px`);
    el.src = cue.src;
    addItem(root, el, cue, {x: cue.x, y: cue.y, tilt: cue.tilt ?? 0, seed, flip: cue.flip});
  },
  march(root, cue, seed) {
    for (let i = 0; i < (cue.count || 4); i++) {
      const el = node('img', 'ob shadow', `width:${cue.w}px`);
      el.src = cue.src;
      addItem(root, el, cue, {x: 0, y: cue.y, seed: seed + i, enter: 'none', flip: cue.flip, update(it, t) {
        const on = t >= cue.t && t < cue.end;
        it.el.style.visibility = on ? 'visible' : 'hidden';
        if (!on) return;
        const steps = q(t) - q(cue.t), total = Math.max(q(cue.end) - q(cue.t), 1);
        const x = cue.from + (cue.to - cue.from) * steps / total + i * cue.spacing;
        const bob = (steps + i) % 2 ? -7 : 0, rot = (steps + i) % 2 ? -4 : 3;
        it.el.style.transform = `translate(${x - it.w / 2}px,${cue.y - it.h / 2 + bob}px) rotate(${rot}deg) scale(${it.flip},1)`;
      }});
    }
  },
  arrow(root, cue) {
    const {w: W, h: H} = C.format, [x1, y1] = cue.from, [x2, y2] = cue.to;
    const mx = (x1 + x2) / 2 + (y2 - y1) * .25, my = (y1 + y2) / 2 - (x2 - x1) * .25;
    const ang = Math.atan2(y2 - my, x2 - mx), L = 34;
    const head = `M${x2 - L * Math.cos(ang - .5)},${y2 - L * Math.sin(ang - .5)} L${x2},${y2} L${x2 - L * Math.cos(ang + .5)},${y2 - L * Math.sin(ang + .5)}`;
    const svg = node('div', 'ob', `width:${W}px;height:${H}px`,
      `<svg width="${W}" height="${H}" fill="none" stroke="#2b2a28" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="body" d="M${x1},${y1} Q${mx},${my} ${x2},${y2}"/><path class="head" d="${head}"/></svg>`);
    root.appendChild(svg);
    const body = svg.querySelector('.body'), headEl = svg.querySelector('.head'), len = body.getTotalLength();
    body.style.strokeDasharray = len;
    items.push({el: svg, update(it, t) {
      const on = t >= cue.t && t < cue.end;
      svg.style.visibility = 'visible';
      svg.style.display = on ? '' : 'none';
      if (!on) return;
      const p = Math.min((q(t) - q(cue.t)) / (HOLD * .5), 1);
      body.style.strokeDashoffset = len * (1 - p);
      headEl.style.visibility = p >= 1 ? 'visible' : 'hidden';
    }});
  },
  tear(root, cue, seed) {
    const {w: W, h: H} = C.format;
    const sheet = node('div', 'ob shadow', `width:${W}px;height:${H + 80}px`);
    const paper = node('div', 'paper', `height:${H + 80}px;background-color:${cue.color || '#efe4cf'};clip-path:${tornBox(seed)}`);
    sheet.appendChild(paper);
    root.appendChild(sheet);
    items.push({el: sheet, update(it, t) {
      const on = t >= cue.t && t < cue.end;
      sheet.style.visibility = on ? 'visible' : 'hidden';
      if (!on) return;
      const p = (q(t) - q(cue.t)) / Math.max(q(cue.end) - q(cue.t), 1);
      const y = p < .5 ? -H * (1 - p * 2) : H * (p - .5) * 2;
      sheet.style.transform = `translate(0,${y - 40}px) rotate(${(p - .5) * 3}deg)`;
    }});
  },
};

function addFixed(root) {
  const {w: W, h: H} = C.format, win = C.video_window;
  [['top', win.y, 11, '0 6px 7px'], ['bottom', win.y + win.h, 29, '0 -6px 7px']].forEach(([side, edge, seed, sh]) => {
    const wrap = node('div', '', `position:absolute;inset:0;filter:drop-shadow(${sh} rgba(30,20,8,.5))`);
    const p = node('div', 'paper', `height:${H}px;clip-path:${barClip(W, H, edge, seed, side)}`);
    wrap.appendChild(p); root.appendChild(wrap); bars.push(p);
  });
  [[70, win.y - 22, -14], [W - 230, win.y - 18, 11], [90, win.y + win.h - 26, 9], [W - 240, win.y + win.h - 30, -12]].forEach(([x, y, a]) =>
    root.appendChild(node('div', 'tape', `left:${x}px;top:${y}px;width:160px;height:46px;transform:rotate(${a}deg)`)));
  if (C.route) addRoute(root);
  if (C.postmarks) {
    postEl = node('div', 'postmark', `left:${W - 262}px;top:56px;width:196px;height:196px;transform:rotate(11deg)`);
    root.appendChild(postEl);
  }
}

function addRoute(root) {
  const r = C.route, {w: W} = C.format, y = r.y, x1 = r.x1, x2 = r.x2;
  const tent = `<path d="M${x1 - 56},${y + 28} L${x1 - 6},${y - 36} L${x1 + 4},${y - 36} L${x1 + 56},${y + 28} Z" fill="#e3a72f" stroke="#5b4630" stroke-width="4" stroke-linejoin="round"/>
    <path d="M${x1 - 16},${y + 28} L${x1},${y - 6} L${x1 + 16},${y + 28} Z" fill="#5b4630"/>
    <path d="M${x1 - 64},${y + 30} L${x1 + 64},${y + 30}" stroke="#5b4630" stroke-width="4" stroke-linecap="round"/>`;
  const swing = `<path d="M${x2 - 46},${y + 32} L${x2 - 40},${y - 38} M${x2 + 46},${y + 32} L${x2 + 40},${y - 38} M${x2 - 54},${y - 38} L${x2 + 54},${y - 38}" stroke="#5b4630" stroke-width="6" stroke-linecap="round"/>
    <path d="M${x2 - 14},${y - 38} L${x2 - 14},${y + 6} M${x2 + 14},${y - 38} L${x2 + 14},${y + 6}" stroke="#5b4630" stroke-width="2.5"/>
    <path d="M${x2 - 22},${y + 6} L${x2 + 22},${y + 6}" stroke="#d9472b" stroke-width="7" stroke-linecap="round"/>`;
  const svg = node('div', 'route', `position:absolute;left:0;top:0`,
    `<svg width="${W}" height="${C.format.h}"><path d="M${x1 + 50},${y} C${(x1 + x2) / 2},${y - 40} ${(x1 + x2) / 2},${y + 40} ${x2 - 50},${y}" fill="none" stroke="#5b4630" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round" class="track"/>${tent}${swing}
     <text x="${x1}" y="${y + 70}" text-anchor="middle">${r.from}</text><text x="${x2}" y="${y + 70}" text-anchor="middle">${r.to}</text>
     <circle class="dot" r="15" fill="#d9472b" stroke="#fffaf0" stroke-width="5"/></svg>`);
  root.appendChild(svg);
  const track = svg.querySelector('.track'), dot = svg.querySelector('.dot'), len = track.getTotalLength();
  items.push({el: svg, update(it, t) {
    const pts = r.progress, tq = q(t) / HOLD;
    let p = pts[pts.length - 1].p;
    for (let i = 1; i < pts.length; i++) if (tq <= pts[i].t) { const a = pts[i - 1], b = pts[i]; p = a.p + (b.p - a.p) * Math.max(0, (tq - a.t) / (b.t - a.t)); break; }
    const pt = track.getPointAtLength(len * p);
    dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y);
  }});
}

window.init = async (comp) => {
  C = comp;
  document.head.appendChild(node('style', '', '', `@font-face{font-family:Mali;font-weight:700;src:url('${C.fonts_uri}/Mali-Bold.ttf')}`));
  await document.fonts.load('700 40px Mali', 'โดน');
  const root = document.getElementById('root');
  root.style.width = C.format.w + 'px'; root.style.height = C.format.h + 'px';
  addFixed(root);
  C.cues.forEach((cue, i) => {
    const seed = (i + 1) * 101;
    if (TEXT[cue.type]) BUILD.text(root, cue, seed); else BUILD[cue.type](root, cue, seed);
  });
  await Promise.all([...document.images].map(img => img.decode().catch(() => {})));
  for (const it of items) if (it.w === 0 && it.el.offsetWidth) { it.w = it.el.offsetWidth; it.h = it.el.offsetHeight; it.el.style.transformOrigin = `${it.w / 2}px ${it.h / 2}px`; }
  window.seek(0);
};

window.seek = (t) => {
  const tone = latest(C.tones || [{t: 0, color: '#dcc9a8'}], t);
  bars.forEach(b => b.style.backgroundColor = tone.color);
  if (postEl) { const pm = latest(C.postmarks, t); const html = pm.lines.map(s => `<div>${s}</div>`).join(''); if (postEl.innerHTML !== html) postEl.innerHTML = html; }
  for (const it of items) (it.update || standardUpdate)(it, t);
};
</script>
</body>
</html>
